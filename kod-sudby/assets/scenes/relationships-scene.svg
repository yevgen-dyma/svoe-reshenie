<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="rl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a0f1f"/>
      <stop offset="55%" stop-color="#4a1730"/>
      <stop offset="100%" stop-color="#170a14"/>
    </linearGradient>
    <radialGradient id="rl-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a8"/>
      <stop offset="60%" stop-color="#ff6f92"/>
      <stop offset="100%" stop-color="#ff6f92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rl-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1128"/>
      <stop offset="100%" stop-color="#170a14"/>
    </linearGradient>
    <filter id="rl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#rl-sky)"/>
  <circle cx="200" cy="140" r="90" fill="url(#rl-sun)" filter="url(#rl-blur)"/>
  <circle cx="200" cy="140" r="46" fill="#ffdca6" opacity=".9"/>

  <!-- sea -->
  <rect x="0" y="182" width="400" height="78" fill="url(#rl-sea)"/>
  <g stroke="#ff9db3" opacity=".35">
    <line x1="60" y1="196" x2="150" y2="196"/>
    <line x1="220" y1="206" x2="330" y2="206"/>
    <line x1="20" y1="218" x2="120" y2="218"/>
    <line x1="260" y1="228" x2="380" y2="228"/>
  </g>
  <ellipse cx="200" cy="186" rx="44" ry="7" fill="#ffdca6" opacity=".5"/>

  <!-- palms -->
  <g fill="#170a14">
    <path d="M28 260 L34 190" stroke="#170a14" stroke-width="5" fill="none"/>
    <path d="M34 190 Q10 178 4 160 Q22 168 34 186" />
    <path d="M34 190 Q54 172 66 156 Q48 168 34 186" />
    <path d="M34 190 Q20 168 20 148 Q34 160 36 186" />
    <path d="M372 260 L366 196" stroke="#170a14" stroke-width="5" fill="none"/>
    <path d="M366 196 Q344 184 336 168 Q354 176 366 192" />
    <path d="M366 196 Q386 180 396 164 Q380 176 366 192" />
  </g>

  <!-- couple silhouette -->
  <g fill="#12060d">
    <g transform="translate(178,204)">
      <circle cx="0" cy="0" r="7"/>
      <path d="M-7 10 Q0 4 7 10 L8 46 Q0 51 -8 46 Z"/>
      <rect x="-7" y="44" width="5.5" height="18" rx="2.5"/>
      <rect x="1.5" y="44" width="5.5" height="18" rx="2.5"/>
    </g>
    <g transform="translate(196,206)">
      <circle cx="0" cy="0" r="6.5"/>
      <path d="M-8 9 Q0 22 0 30 Q0 22 8 9 Q6 30 0 44 Q-6 30 -8 9 Z"/>
      <rect x="-6" y="42" width="5" height="18" rx="2.5"/>
      <rect x="1" y="42" width="5" height="18" rx="2.5"/>
    </g>
  </g>
</svg>
