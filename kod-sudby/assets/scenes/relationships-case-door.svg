<svg viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="rc-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2a121c"/>
      <stop offset="55%" stop-color="#170a10"/>
      <stop offset="100%" stop-color="#0a0609"/>
    </radialGradient>
    <linearGradient id="rc-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbe4b0"/>
      <stop offset="45%" stop-color="#e6ba6e"/>
      <stop offset="100%" stop-color="#8a5f2c"/>
    </linearGradient>
    <linearGradient id="rc-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1c26"/>
      <stop offset="100%" stop-color="#170a10"/>
    </linearGradient>
    <linearGradient id="rc-seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6df" stop-opacity="0"/>
      <stop offset="14%" stop-color="#fff6df"/>
      <stop offset="86%" stop-color="#f2cd8e"/>
      <stop offset="100%" stop-color="#f2cd8e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rc-fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c21f3f"/>
      <stop offset="100%" stop-color="#5c0f1f"/>
    </linearGradient>
    <radialGradient id="rc-candle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffb066" stop-opacity="0"/>
    </radialGradient>
    <filter id="rc-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="rc-blur-l" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="400" height="520" fill="url(#rc-bg)"/>

  <!-- soft red vignette glow behind arch -->
  <ellipse cx="200" cy="230" rx="190" ry="220" fill="#7a1230" opacity=".35" filter="url(#rc-blur-l)"/>

  <!-- flowing red fabric, behind door/couple -->
  <path d="M-20 300 Q60 220 40 120 Q90 220 60 340 Q30 420 -20 460 Z" fill="url(#rc-fabric)" opacity=".55"/>
  <path d="M420 320 Q340 230 365 130 Q310 230 345 350 Q380 430 420 470 Z" fill="url(#rc-fabric)" opacity=".55"/>
  <path d="M0 480 Q120 430 200 470 Q280 430 400 480 L400 520 L0 520 Z" fill="url(#rc-fabric)" opacity=".4"/>

  <!-- outer arch frame (gothic pointed) -->
  <path d="M70 470 V210 Q70 70 200 40 Q330 70 330 210 V470" fill="none" stroke="url(#rc-gold)" stroke-width="9"/>

  <!-- door leaves -->
  <path d="M80 470 V214 Q80 92 197 62 V470 Z" fill="url(#rc-door)" stroke="#6b3040" stroke-width="1.2" stroke-opacity=".6"/>
  <path d="M320 470 V214 Q320 92 203 62 V470 Z" fill="url(#rc-door)" stroke="#6b3040" stroke-width="1.2" stroke-opacity=".6"/>

  <!-- left panel: tree of life engraving -->
  <g transform="translate(138,190)" stroke="url(#rc-gold)" stroke-width="1.6" fill="none" opacity=".8" stroke-linecap="round">
    <path d="M0 130 V60"/>
    <path d="M0 90 Q-22 76 -30 48"/>
    <path d="M0 78 Q22 64 32 38"/>
    <path d="M0 64 Q-14 44 -12 20"/>
    <path d="M0 64 Q14 44 12 20"/>
    <path d="M0 130 Q-16 140 -30 138"/>
    <path d="M0 130 Q16 140 30 138"/>
  </g>

  <!-- right panel: moon + constellation engraving -->
  <g transform="translate(262,140)" stroke="url(#rc-gold)" stroke-width="1.4" fill="none" opacity=".8">
    <path d="M10 -10 A24 24 0 1 0 10 38 A19 19 0 1 1 10 -10 Z" fill="url(#rc-gold)" opacity=".9" stroke="none"/>
    <g opacity=".85">
      <circle cx="-20" cy="70" r="1.6" fill="url(#rc-gold)" stroke="none"/>
      <circle cx="5" cy="90" r="1.3" fill="url(#rc-gold)" stroke="none"/>
      <circle cx="-30" cy="100" r="1.3" fill="url(#rc-gold)" stroke="none"/>
      <circle cx="-10" cy="115" r="1.6" fill="url(#rc-gold)" stroke="none"/>
      <path d="M-20 70 L5 90 L-30 100 L-10 115" stroke-width="1"/>
    </g>
  </g>

  <!-- center glow seam -->
  <rect x="196" y="58" width="8" height="380" fill="url(#rc-seam)" filter="url(#rc-blur-s)"/>
  <rect x="198.5" y="58" width="3" height="380" fill="#fff8ec"/>

  <!-- heart keyhole emblem -->
  <g transform="translate(200,96)" filter="url(#rc-blur-s)">
    <circle r="22" fill="none" stroke="url(#rc-gold)" stroke-width="2.5"/>
  </g>
  <g transform="translate(200,96)">
    <circle r="22" fill="#170a10" stroke="url(#rc-gold)" stroke-width="2.2"/>
    <path d="M0 9 C-11 1 -11 -9 -3 -9 C0 -9 0 -6 0 -6 C0 -6 0 -9 3 -9 C11 -9 11 1 0 9 Z" fill="url(#rc-gold)"/>
  </g>

  <!-- couple silhouette, foreheads together -->
  <g fill="#0d0509">
    <g transform="translate(180,300)">
      <circle cx="0" cy="0" r="15"/>
      <path d="M-15 20 Q0 6 15 20 L18 96 Q0 108 -18 96 Z"/>
    </g>
    <g transform="translate(220,302)">
      <circle cx="0" cy="0" r="14"/>
      <path d="M-17 16 Q0 44 0 64 Q0 44 17 16 Q13 66 0 96 Q-13 66 -17 16 Z"/>
    </g>
  </g>
  <g stroke="#e6ba6e" stroke-width=".8" opacity=".35" fill="none">
    <circle cx="180" cy="300" r="15"/>
    <circle cx="220" cy="302" r="14"/>
  </g>

  <!-- pedestals with candles -->
  <g>
    <rect x="40" y="440" width="16" height="60" rx="2" fill="#140a0d"/>
    <ellipse cx="48" cy="418" rx="26" ry="14" fill="url(#rc-candle)" filter="url(#rc-blur-l)"/>
    <rect x="44" y="404" width="8" height="18" rx="2" fill="#f4e3c4"/>
    <path d="M48 398 Q44 404 48 408 Q52 404 48 398 Z" fill="#ffb066"/>

    <rect x="344" y="440" width="16" height="60" rx="2" fill="#140a0d"/>
    <ellipse cx="352" cy="418" rx="26" ry="14" fill="url(#rc-candle)" filter="url(#rc-blur-l)"/>
    <rect x="348" y="404" width="8" height="18" rx="2" fill="#f4e3c4"/>
    <path d="M352 398 Q348 404 352 408 Q356 404 352 398 Z" fill="#ffb066"/>
  </g>

  <!-- roses (stylised clusters) -->
  <g fill="#8c1330">
    <g transform="translate(30,470)">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="12" cy="6" r="7"/>
      <circle cx="-10" cy="8" r="7"/>
      <circle cx="4" cy="16" r="6"/>
    </g>
    <g transform="translate(368,472)">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="-12" cy="6" r="7"/>
      <circle cx="10" cy="8" r="7"/>
      <circle cx="-4" cy="16" r="6"/>
    </g>
  </g>
  <g fill="#c21f3f" opacity=".65">
    <circle cx="26" cy="466" r="4"/>
    <circle cx="372" cy="468" r="4"/>
  </g>

  <!-- floor glow -->
  <ellipse cx="200" cy="500" rx="150" ry="14" fill="#c21f3f" opacity=".18" filter="url(#rc-blur-l)"/>
</svg>
