<svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="sd-bg" cx="50%" cy="18%" r="75%">
      <stop offset="0%" stop-color="#241c34"/>
      <stop offset="55%" stop-color="#130f1d"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </radialGradient>
    <linearGradient id="sd-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbe4b0"/>
      <stop offset="45%" stop-color="#e6ba6e"/>
      <stop offset="100%" stop-color="#8a5f2c"/>
    </linearGradient>
    <linearGradient id="sd-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3153"/>
      <stop offset="100%" stop-color="#160f24"/>
    </linearGradient>
    <linearGradient id="sd-seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6df" stop-opacity="0"/>
      <stop offset="12%" stop-color="#fff6df"/>
      <stop offset="88%" stop-color="#f2cd8e"/>
      <stop offset="100%" stop-color="#f2cd8e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sd-floor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c988" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#f0c988" stop-opacity="0"/>
    </radialGradient>
    <filter id="sd-blur-s" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="sd-blur-l" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="400" height="560" fill="url(#sd-bg)"/>

  <!-- stars -->
  <g fill="#fff" opacity=".55">
    <circle cx="42" cy="58" r="1.4"/>
    <circle cx="88" cy="30" r="1"/>
    <circle cx="130" cy="70" r="1.6"/>
    <circle cx="330" cy="46" r="1.3"/>
    <circle cx="360" cy="90" r="1"/>
    <circle cx="300" cy="24" r="1.1"/>
    <circle cx="60" cy="120" r="1"/>
    <circle cx="350" cy="140" r="1.2"/>
    <circle cx="20" cy="160" r="1"/>
    <circle cx="380" cy="180" r="1.3"/>
  </g>

  <!-- floor glow -->
  <ellipse cx="200" cy="520" rx="160" ry="30" fill="url(#sd-floor)" filter="url(#sd-blur-l)"/>

  <!-- outer arch frame -->
  <path d="M60 500 V220 Q60 90 200 90 Q340 90 340 220 V500" fill="none" stroke="url(#sd-gold)" stroke-width="10"/>
  <path d="M60 500 V220 Q60 90 200 90 Q340 90 340 220 V500" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="14" transform="translate(0,4)"/>

  <!-- guardian pillars (simple silhouettes) -->
  <g opacity=".9">
    <rect x="30" y="360" width="18" height="140" rx="4" fill="#241d34" stroke="#4a3c66" stroke-width="1"/>
    <circle cx="39" cy="350" r="11" fill="#241d34" stroke="#4a3c66" stroke-width="1"/>
    <rect x="352" y="360" width="18" height="140" rx="4" fill="#241d34" stroke="#4a3c66" stroke-width="1"/>
    <circle cx="361" cy="350" r="11" fill="#241d34" stroke="#4a3c66" stroke-width="1"/>
  </g>

  <!-- door leaves -->
  <g>
    <path d="M70 500 V226 Q70 112 196 100 V500 Z" fill="url(#sd-door)" stroke="#5a4a78" stroke-width="1.2" stroke-opacity=".6"/>
    <path d="M330 500 V226 Q330 112 204 100 V500 Z" fill="url(#sd-door)" stroke="#5a4a78" stroke-width="1.2" stroke-opacity=".6"/>
    <!-- panel lines -->
    <g stroke="url(#sd-gold)" stroke-width="1.6" opacity=".8" fill="none">
      <rect x="86" y="150" width="92" height="130" rx="6"/>
      <rect x="86" y="300" width="92" height="150" rx="6"/>
      <rect x="222" y="150" width="92" height="130" rx="6"/>
      <rect x="222" y="300" width="92" height="150" rx="6"/>
    </g>
  </g>

  <!-- center glow seam -->
  <rect x="196" y="96" width="8" height="410" fill="url(#sd-seam)" filter="url(#sd-blur-s)"/>
  <rect x="198.5" y="96" width="3" height="410" fill="#fffdf4"/>

  <!-- emblem -->
  <g transform="translate(200,150)" filter="url(#sd-blur-s)">
    <circle r="20" fill="none" stroke="url(#sd-gold)" stroke-width="2.5"/>
  </g>
  <g transform="translate(200,150)">
    <circle r="20" fill="none" stroke="url(#sd-gold)" stroke-width="2"/>
    <path d="M0 -11 L9 3 L0 15 L-9 3 Z" fill="url(#sd-gold)"/>
    <circle cy="-1" r="3.4" fill="#150f22"/>
  </g>
</svg>
