<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <radialGradient id="fm-bg" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#2a1c10"/>
      <stop offset="100%" stop-color="#100a06"/>
    </radialGradient>
    <linearGradient id="fm-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1cd97"/>
      <stop offset="100%" stop-color="#a97a3a"/>
    </linearGradient>
    <filter id="fm-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="400" height="260" fill="url(#fm-bg)"/>
  <ellipse cx="200" cy="90" rx="120" ry="70" fill="#dba25a" opacity=".16" filter="url(#fm-blur)"/>

  <!-- tree -->
  <g stroke="url(#fm-gold)" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M200 200 V120"/>
    <path d="M200 150 Q170 130 150 95"/>
    <path d="M200 140 Q230 118 250 88"/>
    <path d="M200 130 Q195 100 180 70"/>
    <path d="M200 130 Q210 100 225 72"/>
  </g>
  <g fill="url(#fm-gold)" opacity=".85">
    <circle cx="150" cy="90" r="4"/>
    <circle cx="250" cy="83" r="4"/>
    <circle cx="180" cy="66" r="4"/>
    <circle cx="225" cy="68" r="4"/>
    <circle cx="200" cy="56" r="5"/>
  </g>

  <!-- roots -->
  <g stroke="url(#fm-gold)" stroke-width="2" fill="none" opacity=".7">
    <path d="M200 200 Q180 212 160 224"/>
    <path d="M200 200 Q220 212 240 224"/>
  </g>

  <!-- ground line -->
  <rect x="0" y="200" width="400" height="1.5" fill="#a97a3a" opacity=".35"/>

  <!-- photo 1 -->
  <g transform="translate(70,150) rotate(-8)">
    <rect x="0" y="0" width="46" height="56" rx="2" fill="#1d140c" stroke="#a97a3a" stroke-width="2"/>
    <rect x="6" y="6" width="34" height="34" fill="#3a2a18"/>
    <circle cx="23" cy="20" r="7" fill="#a97a3a" opacity=".6"/>
    <path d="M12 40 Q23 26 34 40 Z" fill="#a97a3a" opacity=".6"/>
  </g>

  <!-- photo 2 -->
  <g transform="translate(290,160) rotate(10)">
    <rect x="0" y="0" width="42" height="52" rx="2" fill="#1d140c" stroke="#a97a3a" stroke-width="2"/>
    <rect x="5" y="5" width="32" height="32" fill="#3a2a18"/>
    <circle cx="21" cy="18" r="6.5" fill="#a97a3a" opacity=".6"/>
    <path d="M10 36 Q21 24 32 36 Z" fill="#a97a3a" opacity=".6"/>
  </g>

  <!-- book -->
  <g transform="translate(160,210)">
    <path d="M0 24 Q40 8 80 24 V34 Q40 18 0 34 Z" fill="#3a2a18" stroke="#a97a3a" stroke-width="1.6"/>
    <path d="M40 12 V32" stroke="#a97a3a" stroke-width="1.2" opacity=".8"/>
  </g>

  <!-- magnifier -->
  <g transform="translate(230,190)" stroke="url(#fm-gold)" stroke-width="2.4" fill="none">
    <circle cx="0" cy="0" r="11"/>
    <line x1="8" y1="8" x2="20" y2="20"/>
  </g>
</svg>
